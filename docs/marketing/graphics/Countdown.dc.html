<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; }
    a { color: #ebb53c; } a:hover { color: #f3c860; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; background: #062a40; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 80px 72px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <img src="logo-jack.png" alt="Jack of All Trades" style="width: 170px; height: auto; background: #fff; border-radius: 22px; padding: 12px 16px;">
    <div style="font-size: 24px; font-weight: 800; letter-spacing: 0.2em; color: #ebb53c; text-transform: uppercase;">Countdown to the draw</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
    <div style="font-size: 320px; line-height: 0.82; font-weight: 900; color: #ebb53c; letter-spacing: -0.04em;">{{days}}</div>
    <div style="font-size: 64px; font-weight: 900; letter-spacing: 0.02em; margin-top: 8px;">DAYS LEFT</div>
    <div style="font-size: 34px; font-weight: 500; color: #dbe6ee; margin-top: 22px;">to the 50/50 drawing at Ford Field</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="font-size: 34px; font-weight: 900;">Get your tickets now</div>
    <div style="font-size: 30px; font-weight: 700; color: #ebb53c;">joatamp.org/raffle</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const draw = new Date("2026-12-28T21:15:00-05:00");
    const days = Math.max(0, Math.ceil((draw - new Date()) / 86400000));
    return { days: days };
  }
}
</script>
</body>
</html>
