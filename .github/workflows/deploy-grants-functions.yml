# ============================================================================
#  Jacks of All Trades — auto-deploy the grant Edge Functions to Supabase
#  File: .github/workflows/deploy-grants-functions.yml
#  Generated: 2026-09-29 17:30 UTC
#  Updated:   2026-09-29 19:45 UTC · also deploys grants-agents, donors-agents, ai-agent
#
#  On every push to main that touches the grant functions (or when run by hand
#  from GitHub → Actions → "Deploy grant functions" → Run workflow), this:
#    1. deploys grants-search and grants-daily to project gecnvzjuppmqcfcpmugq
#    2. runs the same "Test grant connections" check the hub has, and prints
#       ✅/❌ for Simpler.Grants.gov, Grants.gov and SAM.gov in the run log.
#
#  ONE-TIME SETUP: GitHub repo → Settings → Secrets and variables → Actions →
#  New repository secret:  SUPABASE_ACCESS_TOKEN  = a personal access token from
#  supabase.com/dashboard/account/tokens. (The grant API keys stay in Supabase.)
# ============================================================================
name: Deploy grant functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/grants-search/**"
      - "supabase/functions/grants-daily/**"
      - "supabase/functions/grants-agents/**"
      - "supabase/functions/donors-agents/**"
      - "supabase/functions/social-agent/**"
      - "supabase/functions/ai-agent/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-grants-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-grants-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gecnvzjuppmqcfcpmugq
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions). Get it at supabase.com/dashboard/account/tokens"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy grants-search
        run: supabase functions deploy grants-search --project-ref "$PROJECT_REF"

      - name: Deploy grants-daily
        run: supabase functions deploy grants-daily --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy grants-agents (AI team)
        run: supabase functions deploy grants-agents --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy donors-agents (Paige + Cole)
        run: supabase functions deploy donors-agents --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy social-agent (Nova social posts)
        run: supabase functions deploy social-agent --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy ai-agent (agent chat)
        run: supabase functions deploy ai-agent --project-ref "$PROJECT_REF"

      - name: Test grant connections
        run: |
          ANON=$(grep -o 'anonKey: *"[^"]*"' assets/js/config.js | cut -d'"' -f2)
          sleep 10  # let the new version go live
          OUT=$(curl -sS -m 120 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/grants-search" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ANON" -H "apikey: $ANON" \
            -d '{"diagnose":true}')
          echo "$OUT" | python3 -c '
          import json, sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
          except Exception:
              print("::error::grants-search did not return JSON: " + raw[:300]); sys.exit(1)
          if not d.get("diagnose"):
              print("::error::grants-search error: " + raw[:300]); sys.exit(1)
          for key, name in (("simpler", "Simpler.Grants.gov"), ("grantsgov", "Grants.gov (legacy)"), ("sam", "SAM.gov")):
              r = d.get(key) or {}
              mark = "✅" if r.get("ok") else ("⚪" if r.get("configured") is False else "❌")
              if r.get("ok"):
                  detail = str(r.get("count", 0)) + " results" + (" — e.g. " + r["sample"] if r.get("sample") else "")
              else:
                  detail = r.get("error", "failed")
              print(f"{mark} {name}: {detail}")
          ok = any((d.get(k) or {}).get("ok") for k in ("simpler", "grantsgov", "sam"))
          if not ok:
              print("::error::No grant source is working — see lines above"); sys.exit(1)
          '
